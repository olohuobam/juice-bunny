<div style="margin:0;padding:0;background:#0a0a0f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <div style="max-width:480px;margin:0 auto;padding:40px 24px">
    <div style="text-align:center;margin-bottom:28px">
      <span style="font-size:26px;font-weight:800;color:#ff2d78;letter-spacing:.5px">Juice Bunny</span>
    </div>
    <div style="background:#15151d;border:1px solid #26262f;border-radius:16px;padding:36px 28px;text-align:center">
      <h1 style="margin:0 0 12px;font-size:22px;color:#ffffff;font-weight:700">Confirm your email</h1>
      <p style="margin:0 0 26px;font-size:15px;line-height:1.6;color:#a8a8b3">
        Welcome to Juice Bunny. Tap the button below to verify your email and activate your account.
      </p>
      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#ff2d78;color:#ffffff;text-decoration:none;font-size:16px;font-weight:600;padding:14px 38px;border-radius:10px">
        Confirm Email
      </a>
      <p style="margin:26px 0 0;font-size:12px;line-height:1.6;color:#6c6c78">
        If you didn't create a Juice Bunny account, you can safely ignore this email.
      </p>
    </div>
    <p style="text-align:center;margin:22px 0 0;font-size:12px;color:#5a5a66">
      Juice Bunny &middot; Adults only (18+) &middot; juicebunnytv.com
    </p>
  </div>
</div>
