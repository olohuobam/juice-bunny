<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live — Juice Bunny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.20.0/AgoraRTC_N.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#FF2D78;--pink2:#e0206a;--pink-glow:rgba(255,45,120,.35);
--bg:#0d0d12;--bg2:#12121a;--bg3:#1a1a24;--text:#fff;--text2:#a0a0b0;--text3:#606070;
--border:rgba(255,255,255,.08);--success:#2ecc71;--error:#ff4444;--gold:#ffb020}
html,body{overflow-x:hidden;max-width:100%;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}

.nav{display:flex;align-items:center;gap:16px;padding:12px 20px;background:rgba(13,13,18,.92);
border-bottom:1px solid var(--border);flex-shrink:0}
.nav-logo{display:flex;align-items:center;gap:8px;font-family:'Dancing Script',cursive;font-size:21px;font-weight:700}
.nav-logo img{height:28px}
.nav-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(255,68,68,.9);color:#fff;
font-size:11px;font-weight:800;letter-spacing:.6px;padding:4px 10px;border-radius:9px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.viewers-tag{background:var(--bg3);border:1px solid var(--border);font-size:12px;font-weight:600;padding:5px 11px;border-radius:9px}
.btn-leave{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 15px;border-radius:12px;font-size:13px;font-weight:600}
.btn-leave:hover{border-color:var(--error);color:var(--error)}

.stage{flex:1;display:grid;grid-template-columns:1fr 320px;gap:0;min-height:0}
.video-area{position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:0}
#localPlayer,#remotePlayer{width:100%;height:100%;position:absolute;inset:0}
#localPlayer video,#remotePlayer video{object-fit:contain !important}
.video-placeholder{text-align:center;color:var(--text3);z-index:1}
.video-placeholder .big{font-size:60px;display:block;margin-bottom:12px}
.stream-title-overlay{position:absolute;top:16px;left:16px;z-index:3;background:rgba(0,0,0,.55);
backdrop-filter:blur(6px);padding:8px 14px;border-radius:12px;max-width:70%}
.stream-title-overlay .t{font-size:15px;font-weight:600}
.stream-title-overlay .c{font-size:12px;color:var(--text2);margin-top:2px}

/* Host controls */
.host-controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:4;
display:flex;gap:12px;background:rgba(13,13,18,.7);backdrop-filter:blur(10px);padding:10px 14px;border-radius:16px}
.ctrl-btn{width:46px;height:46px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);
color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;transition:.18s}
.ctrl-btn:hover{border-color:var(--pink)}
.ctrl-btn.off{background:var(--error);border-color:var(--error)}
.ctrl-btn.end{background:var(--error);border-color:var(--error);width:auto;padding:0 18px;border-radius:23px;font-size:14px;font-weight:700}

/* Chat */
.chat-panel{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13px;line-height:1.5}
.msg .who{font-weight:700;color:var(--pink)}
.msg .who.host{color:var(--gold)}
.chat-empty{color:var(--text3);font-size:12.5px;text-align:center;padding:24px 10px}
.chat-input-row{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.chat-input-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;
padding:10px 13px;color:var(--text);font-family:inherit;font-size:14px}
.chat-input-row input:focus{outline:none;border-color:var(--pink)}
.chat-send{background:var(--pink);color:#fff;padding:0 16px;border-radius:12px;font-weight:700;font-size:13px}
.chat-send:hover{background:var(--pink2)}

/* Gate / loading / error screens */
.screen{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}
.screen-box{max-width:420px}
.screen-box .big{font-size:52px;display:block;margin-bottom:14px}
.screen-box h2{font-family:'Dancing Script',cursive;font-size:30px;margin-bottom:8px}
.screen-box p{color:var(--text2);font-size:14.5px;line-height:1.7;margin-bottom:18px}
.btn{background:var(--pink);color:#fff;padding:12px 24px;border-radius:14px;font-size:14.5px;font-weight:700;display:inline-block}
.btn:hover{background:var(--pink2);box-shadow:0 0 18px var(--pink-glow)}

@media(max-width:820px){
  .stage{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .chat-panel{border-left:none;border-top:1px solid var(--border);max-height:38vh}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html"><img src="white-rabbit-logo.png" alt=""/> Juice Bunny</a>
  <div class="nav-right">
    <span class="live-pill" id="livePill" style="display:none"><span class="live-dot"></span>LIVE</span>
    <span class="viewers-tag" id="viewersTag" style="display:none">👤 <span id="viewerCount">0</span></span>
    <button class="btn-leave" onclick="leaveAndExit()">Leave</button>
  </div>
</nav>

<div id="root" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="screen"><div class="screen-box"><span class="big">🎥</span><h2>Connecting…</h2><p>Setting up the stream.</p></div></div>
</div>

<script>
const SUPABASE_URL='https://ewhhufhnfrhherjmbvqq.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3aGh1ZmhuZnJoaGVyam1idnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjA3NjYsImV4cCI6MjA5NzI5Njc2Nn0.F2Jso5b9G2M67kW1Ty5oGGgH9wYqH0rcI1c3iToByhM';
const TOKEN_FN = SUPABASE_URL + '/functions/v1/agora-token';

let sb=null, me=null, myName='Guest', stream=null, isHost=false;
let client=null, localTracks={audio:null,video:null}, joined=false, chatChannel=null;

const id = new URLSearchParams(location.search).get('id');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function screen(html){ document.getElementById('root').innerHTML = `<div class="screen"><div class="screen-box">${html}</div></div>`; }

const s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
s.onload=async()=>{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); await init(); };
document.head.appendChild(s);

async function init(){
  if(!id){ return screen('<span class="big">🐰</span><h2>No stream selected</h2><p>This link is missing a stream.</p><a class="btn" href="cams.html">Browse Cams</a>'); }

  const {data:{session}}=await sb.auth.getSession();
  me=session?.user||null;
  if(me){
    const {data:p}=await sb.from('profiles').select('full_name,email').eq('id',me.id).maybeSingle();
    myName = p?.full_name || p?.email?.split('@')[0] || 'Member';
  }

  // Load stream + creator
  const {data,error}=await sb.from('live_streams')
    .select('*, profiles:creator_id(full_name,email)').eq('id',id).maybeSingle();
  if(error||!data){ return screen('<span class="big">🐰</span><h2>Stream not found</h2><p>It may have ended.</p><a class="btn" href="cams.html">Browse Cams</a>'); }
  stream=data;
  isHost = me && me.id===stream.creator_id;

  if(stream.status!=='live' && !isHost){
    return screen(`<span class="big">⏳</span><h2>${esc(stream.title)}</h2><p>This stream hasn't started yet. Check back when the creator goes live.</p><a class="btn" href="cams.html">Browse Cams</a>`);
  }

  // Access check for viewers (creator/admin always allowed by the function)
  if(!isHost){
    const {data:allowed,error:accErr}=await sb.rpc('can_join_stream',{p_stream_id:id});
    if(accErr){ return screen('<span class="big">🐰</span><h2>Access check failed</h2><p>Please try again.</p><a class="btn" href="cams.html">Back</a>'); }
    if(!allowed){
      const msg = stream.access_type==='invite' ? '🔐 This stream is invite only.'
        : stream.access_type==='followers' ? '💗 Follow this creator to join.'
        : '🎟️ A subscription is needed to watch.';
      return screen(`<span class="big">🔒</span><h2>Can't join</h2><p>${msg}</p><a class="btn" href="cams.html">Browse Cams</a>`);
    }
  }

  renderRoom();
  await connectAgora();
  subscribeChat();
}

function renderRoom(){
  const cname = stream.profiles?.full_name || stream.profiles?.email?.split('@')[0] || 'Creator';
  document.getElementById('root').innerHTML = `
    <div class="stage">
      <div class="video-area" id="videoArea">
        <div class="stream-title-overlay">
          <div class="t">${esc(stream.title)}</div>
          <div class="c">${esc(cname)}${stream.billing_mode==='per_minute'?` · $${Number(stream.rate_per_min||0).toFixed(2)}/min`:''}</div>
        </div>
        <div class="video-placeholder" id="vidPlaceholder">
          <span class="big">${isHost?'📹':'🎥'}</span>
          ${isHost?'Starting your camera…':'Waiting for creator\\'s video…'}
        </div>
        <div id="remotePlayer"></div>
        <div id="localPlayer"></div>
        ${isHost?`
        <div class="host-controls">
          <button class="ctrl-btn" id="micBtn" onclick="toggleMic()" title="Mute">🎤</button>
          <button class="ctrl-btn" id="camBtn" onclick="toggleCam()" title="Camera">📷</button>
          <button class="ctrl-btn end" onclick="endStream()">■ End Stream</button>
        </div>`:''}
      </div>
      <div class="chat-panel">
        <div class="chat-head">💬 Live Chat</div>
        <div class="chat-msgs" id="chatMsgs"><div class="chat-empty">Say hi 👋</div></div>
        <div class="chat-input-row">
          <input id="chatInput" placeholder="${me?'Message…':'Sign in to chat'}" ${me?'':'disabled'}
                 onkeydown="if(event.key==='Enter')sendChat()"/>
          <button class="chat-send" onclick="sendChat()" ${me?'':'disabled'}>Send</button>
        </div>
      </div>
    </div>`;
  document.getElementById('livePill').style.display='flex';
  document.getElementById('viewersTag').style.display='inline-flex';
}

async function getToken(role){
  const res=await fetch(TOKEN_FN,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY},
    body:JSON.stringify({channel:stream.room_name||('jb_'+id.slice(0,8)), uid:0, role})
  });
  if(!res.ok) throw new Error('token request failed');
  return await res.json();
}

async function connectAgora(){
  if(typeof AgoraRTC==='undefined'){
    const ph=document.getElementById('vidPlaceholder');
    if(ph) ph.innerHTML='<span class="big">⚠️</span>Video SDK didn't load.<br/><span style="font-size:12px;color:var(--text3)">Check connection or disable ad-blockers, then reload.</span>';
    return;
  }
  try{
    const role = isHost ? 'host' : 'audience';
    const { token, appId, channel, uid } = await getToken(role);

    client = AgoraRTC.createClient({ mode:'live', codec:'vp8' });
    await client.setClientRole(isHost ? 'host' : 'audience');

    // Remote (viewers see host; host sees co-hosts)
    client.on('user-published', async (user, mediaType)=>{
      await client.subscribe(user, mediaType);
      const ph=document.getElementById('vidPlaceholder'); if(ph) ph.style.display='none';
      if(mediaType==='video'){ user.videoTrack.play('remotePlayer'); }
      if(mediaType==='audio'){ user.audioTrack.play(); }
    });
    client.on('user-unpublished',(user,mediaType)=>{
      if(mediaType==='video'){ const ph=document.getElementById('vidPlaceholder'); if(ph) ph.style.display='block'; }
    });
    client.on('user-joined',()=>updateViewerCount());
    client.on('user-left',()=>updateViewerCount());

    await client.join(appId, channel, token, uid);

    if(isHost){
      localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
      localTracks.video = await AgoraRTC.createCameraVideoTrack();
      const ph=document.getElementById('vidPlaceholder'); if(ph) ph.style.display='none';
      localTracks.video.play('localPlayer');
      await client.publish([localTracks.audio, localTracks.video]);
    }
    joined=true;
    updateViewerCount();

    // Record the join (viewers) for participant/billing tracking
    if(me && !isHost){
      await sb.from('stream_participants').insert({ stream_id:id, user_id:me.id, role:'viewer' });
    }
  }catch(err){
    console.error('Agora connect failed', err);
    const ph=document.getElementById('vidPlaceholder');
    if(ph) ph.innerHTML = '<span class="big">⚠️</span>Could not start video.<br/><span style="font-size:12px;color:var(--text3)">'+esc(err.message||'')+'</span>';
    if(err.message && /Permission|NotAllowed|device/i.test(err.message)){
      if(ph) ph.innerHTML = '<span class="big">📷</span>Camera/mic blocked.<br/><span style="font-size:12px;color:var(--text3)">Allow camera & microphone access, then reload.</span>';
    }
  }
}

function updateViewerCount(){
  if(!client) return;
  // remoteUsers = everyone else in channel; +1 loosely for self if audience not counted
  const n = client.remoteUsers.length + (isHost?0:0);
  document.getElementById('viewerCount').textContent = Math.max(n,0);
  // keep peak_viewers fresh (host only, best-effort)
  if(isHost && me){
    sb.from('live_streams').update({ peak_viewers: n }).eq('id',id).then(()=>{});
  }
}

async function toggleMic(){
  if(!localTracks.audio) return;
  const on = localTracks.audio.enabled;
  await localTracks.audio.setEnabled(!on);
  document.getElementById('micBtn').classList.toggle('off', on);
}
async function toggleCam(){
  if(!localTracks.video) return;
  const on = localTracks.video.enabled;
  await localTracks.video.setEnabled(!on);
  document.getElementById('camBtn').classList.toggle('off', on);
}

async function endStream(){
  if(!confirm('End this stream for everyone?')) return;
  await sb.from('live_streams').update({status:'ended',ended_at:new Date().toISOString()}).eq('id',id);
  await cleanup();
  window.location.href='go-live.html';
}

async function leaveAndExit(){
  await cleanup();
  window.location.href = isHost ? 'go-live.html' : 'cams.html';
}

async function cleanup(){
  try{
    if(localTracks.audio){ localTracks.audio.stop(); localTracks.audio.close(); }
    if(localTracks.video){ localTracks.video.stop(); localTracks.video.close(); }
    if(client && joined){ await client.leave(); }
    if(chatChannel){ sb.removeChannel(chatChannel); }
    if(me && !isHost){
      await sb.from('stream_participants').update({left_at:new Date().toISOString()})
        .eq('stream_id',id).eq('user_id',me.id).is('left_at',null);
    }
  }catch(e){}
}
window.addEventListener('beforeunload', ()=>{ cleanup(); });

/* ── CHAT (Supabase realtime) ── */
function subscribeChat(){
  loadChatHistory();
  chatChannel = sb.channel('stream-chat-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'stream_messages',filter:'stream_id=eq.'+id},
      payload=>appendMsg(payload.new))
    .subscribe();
}
async function loadChatHistory(){
  const {data}=await sb.from('stream_messages')
    .select('*, profiles:user_id(full_name,email)').eq('stream_id',id)
    .order('created_at',{ascending:true}).limit(50);
  const box=document.getElementById('chatMsgs');
  if(!data||!data.length){ return; }
  box.innerHTML='';
  data.forEach(m=>appendMsg(m,true));
}
function appendMsg(m, fromHistory){
  const box=document.getElementById('chatMsgs');
  const empty=box.querySelector('.chat-empty'); if(empty) empty.remove();
  const who = m.profiles ? (m.profiles.full_name||m.profiles.email?.split('@')[0]) : (m._name||'Member');
  const isCreatorMsg = m.user_id===stream.creator_id;
  const div=document.createElement('div');
  div.className='msg';
  div.innerHTML=`<span class="who ${isCreatorMsg?'host':''}">${esc(who)}${isCreatorMsg?' 👑':''}:</span> ${esc(m.body)}`;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}
async function sendChat(){
  const inp=document.getElementById('chatInput');
  const body=(inp.value||'').trim();
  if(!body||!me) return;
  inp.value='';
  await sb.from('stream_messages').insert({stream_id:id,user_id:me.id,body});
}
</script>
</body>
</html>
